[project]
name = "rotor-gateway"
version = "0.5.1"
description = "Self-hosted LLM gateway exposing OpenAI Chat, OpenAI Responses, and Anthropic Messages over multiple upstream channels."
authors = [
    {name = "runkezhong",email = "jarvisshangye@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["llm", "gateway", "openai", "anthropic", "responses", "router"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "aiosqlite==0.22.1",
    "mindagent>=0.5.3",
]

[project.optional-dependencies]
examples = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
]
mcp = [
    "mcp>=2,<3",
]

[project.scripts]
rotor = "rotor.cli:main"

[project.urls]
Homepage = "https://github.com/SyJarvis/rotor"
Repository = "https://github.com/SyJarvis/rotor"
Documentation = "https://github.com/SyJarvis/rotor/tree/main/gitbook"
Changelog = "https://github.com/SyJarvis/rotor/blob/main/changelog.md"

[tool.poetry]
# "benchmarks" is a developer harness, not part of the installable API: keeping
# it out of the wheel avoids publishing a generic top-level import name.
# "mindagent" is the published MindAgent package (see dependencies), not a
# vendored copy: shipping it here would shadow a user's own install.
packages = [
    {include = "rotor", from = "src"},
]
include = [
    "src/rotor/frontend/**/*",
    "src/rotor/migrations/script.py.mako",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
