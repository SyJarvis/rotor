[project]
name = "rotor-gateway"
version = "0.2.4"
description = ""
authors = [
    {name = "runkezhong",email = "jarvisshangye@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "aiosqlite==0.22.1",
]

[project.optional-dependencies]
examples = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
]
mcp = [
    "mcp>=2,<3",
]

[project.scripts]
rotor = "rotor.cli:main"

[tool.poetry]
packages = [
    {include = "rotor", from = "src"},
    {include = "mindagent", from = "src"},
]
include = ["src/rotor/frontend/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
