[project]
name = "rotor-mcp"
version = "0.1.0"
description = "MCP adapter for the Rotor Control API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "pydantic-settings>=2.1,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
rotor-mcp = "rotor_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotor_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../src"]
