site_name: Rotor
site_url: https://syjarvis.github.io/rotor/
site_description: 一个 API-only 的 LLM 网关,兼容 OpenAI / Anthropic / Responses 协议
site_author: runkezhong

repo_url: https://github.com/SyJarvis/rotor
repo_name: SyJarvis/rotor
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# ---------- 主题 ----------
theme:
  name: material
  language: zh
  features:
    - navigation.tabs            # 顶部 tab 导航
    - navigation.tabs.sticky     # 滚动时 tab 吸顶
    - navigation.sections        # 侧边栏按章节分组
    - navigation.expand          # 默认展开所有章节
    - navigation.indexes         # section 索引页
    - navigation.top             # 回到顶部按钮
    - navigation.tracking        # URL 随锚点变化
    - search.suggest             # 搜索建议
    - search.highlight           # 搜索高亮
    - search.share               # 分享搜索链接
    - content.code.copy          # 代码块一键复制
    - content.code.annotate      # 代码注释
    - content.tabs.link          # 内容 tab 联动
    - toc.follow                 # 右侧目录跟随
    - header.autohide            # 滚动时隐藏顶栏
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色

# ---------- 插件 ----------
plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u2000-\u206F\u2E00-\u2E7F\\!"#$%&()*+,\-./:;<=>?@\\\]^_`{|}~]'

# ---------- Markdown 扩展 ----------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SyJarvis/rotor
  generator: false

# ---------- 导航 ----------
nav:
  - 首页: index.md
  - 快速上手:
      - 安装与运行: getting-started.md
      - 渠道配置: channels.md
      - 调用示例: examples.md
      - Codex / Claude Code / OpenCode: client-integrations.md
  - 架构设计:
      - 流式请求与异步记账: 流式请求与异步记账设计.md
      - 模型卡与模型能力知识库: model-cards-design.md
      - 实现路线图: roadmap.md
  - 性能:
      - 基准测试: 基准测试.md
