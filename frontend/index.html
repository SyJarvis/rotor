<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rotor 管理控制台</title>
    <link rel="stylesheet" href="/styles.css?v=3">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1 data-i18n="pageTitle">Rotor 管理控制台</h1>
        <p data-i18n="subtitle">模型渠道、API Key、用量与请求日志</p>
      </div>
      <button id="toggleLocale" class="secondary" data-i18n="language">English</button>
    </header>

    <main class="layout">
      <nav class="tabs" aria-label="Admin sections">
        <button class="tab active" data-tab="overview" data-i18n="overview">接入信息</button>
        <button class="tab" data-tab="channels" data-i18n="channels">模型渠道</button>
        <button class="tab" data-tab="tokens" data-i18n="apiKeys">API Key</button>
        <button class="tab" data-tab="usage" data-i18n="usage">用量统计</button>
        <button class="tab" data-tab="logs" data-i18n="logs">请求日志</button>
      </nav>

      <section id="notice" class="notice hidden"></section>

      <section id="overview" class="panel active">
        <div class="panel-head">
          <div>
            <h2 data-i18n="gatewayTitle">统一 API 入口</h2>
            <p data-i18n="gatewayDescription">使用 Rotor 创建的 API Key，即可通过以下兼容协议调用已接入的模型。</p>
          </div>
        </div>
        <div class="gateway-base">
          <span data-i18n="baseUrl">服务地址</span>
          <code id="gatewayBaseUrl"></code>
          <button class="secondary copy-button" data-copy-target="gatewayBaseUrl">复制</button>
        </div>
        <div id="gatewayEndpoints" class="endpoint-list"></div>
      </section>

      <section id="channels" class="panel">
        <div class="panel-head">
          <div>
            <h2 data-i18n="channels">模型渠道</h2>
            <p data-i18n="channelsDescription">管理上游服务的 API Key、模型和分发规则。</p>
          </div>
          <div class="actions">
            <button id="refreshChannels" class="secondary" data-i18n="refresh">刷新</button>
            <button id="openChannelModal" data-i18n="addChannel">新增渠道</button>
          </div>
        </div>
        <div id="channelTestResult" class="inline-result hidden"></div>
        <div id="channelsTable" class="table"></div>
      </section>

      <section id="tokens" class="panel">
        <div class="panel-head">
          <div>
            <h2 data-i18n="createKey">创建 API Key</h2>
            <p data-i18n="keyDescription">该 Key 用于客户端调用 Rotor 的统一 API，不是上游服务的 Key。</p>
          </div>
          <button id="refreshTokens" class="secondary" data-i18n="refresh">刷新</button>
        </div>
        <form id="tokenForm" class="grid-form compact">
          <input name="name" data-i18n-placeholder="keyName" placeholder="Key 名称" required>
          <input name="user_id" data-i18n-placeholder="userOptional" placeholder="用户标识（可选）">
          <input name="quota" type="number" data-i18n-placeholder="quotaOptional" placeholder="配额（可选）">
          <input name="allowed_channels" data-i18n-placeholder="allowedChannels" placeholder="允许的渠道 ID，逗号分隔（留空表示全部）">
          <button type="submit" data-i18n="generateKey">生成 Key</button>
        </form>
        <div id="tokensTable" class="table"></div>
      </section>

      <section id="usage" class="panel">
        <div class="panel-head">
          <h2 data-i18n="usage">用量统计</h2>
          <button id="refreshUsage" class="secondary" data-i18n="refresh">刷新</button>
        </div>
        <div id="usageCards" class="cards"></div>
      </section>

      <section id="logs" class="panel">
        <div class="panel-head">
          <h2 data-i18n="logs">请求日志</h2>
          <button id="refreshLogs" class="secondary" data-i18n="refresh">刷新</button>
        </div>
        <div id="logsTable" class="table"></div>
      </section>
    </main>

    <div id="channelModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="channelModalTitle">
      <div class="modal-panel">
        <div class="modal-head">
          <div>
            <h2 id="channelModalTitle" data-i18n="addChannelTitle">新增模型渠道</h2>
            <p data-i18n="addChannelDescription">配置一个上游 API Key 及其可用模型。</p>
          </div>
          <button id="closeChannelModal" class="secondary" type="button" data-i18n="close">关闭</button>
        </div>
        <form id="channelForm" class="modal-form">
          <label>
            <span data-i18n="name">名称</span>
            <input name="name" placeholder="deepseek-main" required>
          </label>
          <label>
            <span data-i18n="provider">服务商</span>
            <select name="type">
              <option value="openai">OpenAI-compatible</option>
              <option value="anthropic">Anthropic</option>
              <option value="moonshot">Moonshot</option>
              <option value="minimax">MiniMax</option>
              <option value="zhipu">Zhipu</option>
              <option value="kimi">Kimi</option>
            </select>
          </label>
          <label>
            <span data-i18n="upstreamBaseUrl">上游 Base URL</span>
            <input name="base_url" placeholder="https://api.deepseek.com" required>
          </label>
          <label>
            <span data-i18n="upstreamApiKey">上游 API Key</span>
            <input name="key" type="password" placeholder="provider api key" required>
          </label>
          <div class="form-row">
            <label>
              <span data-i18n="protocol">协议</span>
              <select name="protocol">
                <option value="openai">openai</option>
                <option value="anthropic">anthropic</option>
              </select>
            </label>
            <label>
              <span data-i18n="priority">优先级</span>
              <input name="priority" type="number" value="1">
            </label>
            <label>
              <span data-i18n="weight">权重</span>
              <input name="weight" type="number" value="1">
            </label>
          </div>
          <label>
            <span data-i18n="models">模型列表</span>
            <textarea name="models" placeholder="deepseek-chat, deepseek-reasoner" required></textarea>
          </label>
          <label>
            <span data-i18n="modelMapping">模型映射 JSON</span>
            <textarea name="model_mapping" placeholder='{"public-model": "provider-model"}'></textarea>
          </label>
          <label class="check"><input name="enabled" type="checkbox" checked> <span data-i18n="enabled">启用</span></label>
          <div id="probeResult" class="inline-result hidden"></div>
          <div class="modal-actions">
            <button id="probeModels" type="button" class="secondary" data-i18n="probeModels">探测模型</button>
            <button type="submit" data-i18n="saveChannel">保存渠道</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/config.js?v=3"></script>
    <script src="/app.js?v=3"></script>
  </body>
</html>
