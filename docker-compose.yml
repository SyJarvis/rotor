services:
  rotor:
    build: .
    container_name: rotor
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/rotor.db
      - CONVERSATION_STORE_DIR=/data/conversations
      - CHAT_STORE_DIR=/data/chats
      - ROTOR_LOG_DIR=/data/logs
      - LOG_LEVEL=INFO
      # Set to true when serving the admin console over HTTPS.
      - ROTOR_ADMIN_COOKIE_SECURE=false
    volumes:
      # Persists the database, gateway records, user chats, attachments, and logs.
      - ./data:/data
    restart: unless-stopped
