name: docs

# Builds the documentation site from gitbook/ and publishes it to GitHub Pages.
# The repository's Pages source must be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).
on:
  push:
    branches: ["main"]
    paths:
      - "gitbook/**"
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build documentation site
        working-directory: site
        env:
          # Project sites are served from /<repository>/, so links and assets
          # need that prefix and the .html suffixes Pages does not rewrite.
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Verify copied page Markdown
        working-directory: site
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: node scripts/verify-raw.mjs
      - name: Verify internal links
        working-directory: site
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: node scripts/verify-links.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
