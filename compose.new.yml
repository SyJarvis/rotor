# New rotor deployment alongside the legacy container (fresh data, port 8001).
name: rotor-new
services:
  rotor:
    build: .
    container_name: rotor-new
    ports:
      - "127.0.0.1:8001:8000"
      - "192.168.4.1:8001:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/rotor.db
      - CONVERSATION_STORE_DIR=/data/conversations
      - CHAT_STORE_DIR=/data/chats
      - ROTOR_LOG_DIR=/data/logs
      - LOG_LEVEL=INFO
      - ROTOR_ADMIN_COOKIE_SECURE=false
    volumes:
      - /home/pi/.rotor-new:/data
    restart: unless-stopped
